server:
  port: 8080

spring:
  application:
    name: taxflow

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taxflow}
    username: ${DB_USERNAME:taxflow}
    password: ${DB_PASSWORD:taxflow_dev_password}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public
    default-schema: public

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  cloud:
    vault:
      enabled: ${VAULT_ENABLED:false}
      uri: ${VAULT_URI:http://localhost:8200}
      token: ${VAULT_TOKEN:}
      scheme: http
      kv:
        enabled: true
        backend: secret
        application-name: taxflow

  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

jwt:
  secret: ${JWT_SECRET:change-me-to-at-least-256-bits-secret-key-for-jwt-signing}
  access-token-expiration: 900000
  refresh-token-expiration: 604800000
  issuer: taxflow

totp:
  issuer: TaxFlow
  digits: 6
  period: 30

audit:
  retention-days: 365

taxflow:
  nts:
    biz-verify:
      enabled: ${NTS_BIZ_VERIFY_ENABLED:false}
      service-key: ${NTS_BIZ_VERIFY_SERVICE_KEY:}
      base-url: https://api.odcloud.kr/api/nts-businessman/v1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    com.taxflow: INFO
    org.springframework.security: DEBUG
    org.hibernate.SQL: WARN
