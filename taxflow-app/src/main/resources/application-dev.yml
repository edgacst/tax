spring:
  # 로컬에서 Redis 컨테이너 없이도 기동 가능 (캐시는 인메모리 등 기본값)
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  datasource:
    # Docker compose: 15432 / PC Postgres 직접 설치: .env 에 DB_PORT=5432
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:15432}/${DB_NAME:taxflow}
    username: ${DB_USERNAME:taxflow}
    password: ${DB_PASSWORD:taxflow_dev_password}
  data:
    redis:
      host: localhost
      port: 6379
  cloud:
    vault:
      enabled: false

jwt:
  secret: dev-secret-key-for-local-development-only-must-be-at-least-256-bits-long!!

# SMTP 없이 로컬 실행 시 Mail 헬스가 DOWN → 전체 /actuator/health 가 503 이 되지 않도록 끔
management:
  health:
    mail:
      enabled: false

logging:
  level:
    com.taxflow: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

# 공공데이터포털 인증키 — 채팅/깃에 올리지 말고 환경 변수로만 주입
# PowerShell: $env:NTS_BIZ_VERIFY_SERVICE_KEY="발급키"; $env:NTS_BIZ_VERIFY_ENABLED="true"
taxflow:
  nts:
    biz-verify:
      enabled: ${NTS_BIZ_VERIFY_ENABLED:false}
      service-key: ${NTS_BIZ_VERIFY_SERVICE_KEY:}
