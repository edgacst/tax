<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TaxFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a222d;
      --border: #2d3a4d;
      --text: #e7edf4;
      --muted: #8b9cb3;
      --accent: #3d8bfd;
      --accent-dim: #2563eb;
      --ok: #34d399;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "DM Sans", system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 20% -10%, #1e3a5f 0%, transparent 55%),
        radial-gradient(900px 500px at 100% 0%, #1a2f4a 0%, transparent 50%),
        var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .shell {
      width: 100%;
      max-width: 420px;
    }
    header {
      margin-bottom: 1.25rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin: 0 0 0.35rem;
    }
    p.lead {
      margin: 0;
      color: var(--muted);
      font-size: 0.9rem;
      line-height: 1.45;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.25rem 1.35rem;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.35);
    }
    .row {
      display: flex;
      gap: 0.65rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }
    button, a.btn {
      font-family: inherit;
      font-size: 0.875rem;
      font-weight: 600;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      padding: 0.6rem 1rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.1s;
    }
    button.primary {
      background: linear-gradient(165deg, var(--accent), var(--accent-dim));
      color: #fff;
    }
    button.primary:hover { filter: brightness(1.06); }
    button.primary:active { transform: scale(0.98); }
    a.btn.secondary {
      background: transparent;
      color: var(--muted);
      border: 1px solid var(--border);
    }
    a.btn.secondary:hover {
      color: var(--text);
      border-color: #4a5f7a;
    }
    pre {
      margin: 0;
      padding: 0.85rem 1rem;
      background: #0d1117;
      border-radius: 10px;
      border: 1px solid #222c38;
      font-size: 0.8rem;
      line-height: 1.5;
      overflow-x: auto;
      color: #c8d4e0;
      min-height: 3.5rem;
    }
    .status {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.65rem;
    }
    .status.ok { color: var(--ok); }
    .status.err { color: #f87171; }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <h1>TaxFlow</h1>
      <p class="lead">백엔드 API를 브라우저에서 바로 확인하는 로컬 화면입니다. React 등 별도 프론트를 붙이면 이 페이지를 대체하면 됩니다.</p>
    </header>
    <div class="card">
      <div class="row">
        <button type="button" class="primary" id="btnPing">Ping 호출</button>
        <a class="btn secondary" href="/swagger-ui/index.html" target="_blank" rel="noopener">Swagger UI</a>
      </div>
      <pre id="out">응답이 여기에 표시됩니다.</pre>
      <div class="status" id="status"></div>
    </div>
  </div>
  <script>
    const out = document.getElementById("out");
    const statusEl = document.getElementById("status");

    async function ping() {
      statusEl.textContent = "요청 중…";
      statusEl.className = "status";
      try {
        const res = await fetch("/api/v1/public/ping");
        const text = await res.text();
        out.textContent = text;
        if (res.ok) {
          statusEl.textContent = "HTTP " + res.status + " — 정상";
          statusEl.className = "status ok";
        } else {
          statusEl.textContent = "HTTP " + res.status;
          statusEl.className = "status err";
        }
      } catch (e) {
        out.textContent = String(e);
        statusEl.textContent = "네트워크 오류 — 앱이 떠 있는지 확인하세요.";
        statusEl.className = "status err";
      }
    }

    document.getElementById("btnPing").addEventListener("click", ping);
  </script>
</body>
</html>
