// Root aggregator: runnable module is :taxflow-app
plugins {
    id 'org.springframework.boot' version '3.4.4' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

allprojects {
    group = 'com.taxflow'
    version = '0.1.0'
}

subprojects {
    repositories {
        mavenCentral()
    }
}
